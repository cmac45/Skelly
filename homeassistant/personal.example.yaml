# Copy to personal.yaml (git-ignored) and fill in your own details.
# tools/skelly.py applies every replacement (exact text, left -> right) to the
# prompts, scripts and automations before deploying them to Home Assistant, so
# the public files stay generic and your Skelly still gets the real thing.
replacements:
  # Personalize the gravestones Skelly guards (see homeassistant/prompts/).
  '"Rest in Peace, Veggies Nobody Ate"': '"Rest in Peace, Grandpa''s Zucchini"'
  # Your Govee spotlight's device ID (Govee Platform API "device" field).
  GOVEE_SPOTLIGHT_DEVICE_ID: "AA:BB:CC:DD:EE:FF:00:11"
  # Your lead Govee curtain's device ID, and the id of the "Workato logo" DIY
  # scene saved on it (Govee Platform API /device/diy-scenes).
  GOVEE_CURTAIN_DEVICE_ID: "AA:BB:CC:DD:EE:FF:00:22"
  WORKATO_LOGO_DIY_ID: "12345678"
